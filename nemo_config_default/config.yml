models:
  - type: main
    engine: groq
    model: llama-3.3-70b-versatile

instructions:
  - type: general
    content: |
      당신은 사내 보안 정책을 안내하는 AI 어시스턴트입니다.
      주어진 문서를 참고하여 사용자의 질문에 답변합니다.
      문서에 명시된 내용을 우선 참고하되, 모호하거나 불분명한 경우에는 임의로 권한 부여나 실행을 결정하지 않습니다.

rails:
  input:
    flows:
      - self check input
  output:
    flows:
      - self check output
  retrieval:
    flows: []
